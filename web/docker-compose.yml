services:
  mediasite:
    build: .
    container_name: mediasite
    restart: unless-stopped
    # 默认只发布到宿主回环；设好 SITE_PASSWORD 后把 .env 里 BIND_ADDR 改为 0.0.0.0 再对外
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8899:8899"
    volumes:
      # 仓库根的 data/ 是站点与 crawler-agent 的共享目录（控制状态也在这里交换）
      - ../data:/app/data
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=8899
      - TMDB_RPS=${TMDB_RPS:-8}
      - MIN_YEAR=${MIN_YEAR:-1990}   # 收录年份下限；调早会放大 movie-popular-old 段页数
      - IMGCACHE_MAX_MB=${IMGCACHE_MAX_MB:-2048}
      - FULL_SYNC=${FULL_SYNC:-0}   # 置 1 则下次启动强制全量重拉各榜单
      - SYNC_INTERVAL_H=${SYNC_INTERVAL_H:-24}
      # 指向宿主上的 Prowlarr / bitmagnet（两者都在宿主机网络里监听）
      - PROWLARR_URL=${PROWLARR_URL:-http://host.docker.internal:9696}
      - BITMAGNET_URL=${BITMAGNET_URL:-http://host.docker.internal:3333}
      # 需要走代理才能访问 TMDB / 豆瓣时，把 HTTP_PROXY、HTTPS_PROXY 写进 .env；
      # node 内置 fetch 不认这两个变量，NODE_USE_ENV_PROXY=1 才会启用。
      # NO_PROXY 必须含 host.docker.internal，否则访问 Prowlarr / bitmagnet 会被丢进代理。
      - NODE_USE_ENV_PROXY=1
      # stream 是 compose 内网服务名，必须直连（不经代理）
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,.douban.com,stream
      # 播放 sidecar 地址（默认即下方 stream 服务；sidecar 跑在别处时覆盖为 http://host.docker.internal:11470）
      - STREAM_URL=${STREAM_URL:-http://stream:11470}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 播放 sidecar：BT 边下边播 + HLS 转码（stremio-libtorrent-server）。11470 不对宿主发布，仅经 compose 内网访问
  stream:
    image: androshack/stremio-libtorrent-server:latest
    container_name: stremio-stream
    restart: unless-stopped
    # VAAPI 硬编需要核显节点；无 /dev/dri 的机器删掉这两行（转码自动退到 CPU，慢且吃满核心）
    devices:
      - /dev/dri:/dev/dri
    environment:
      # 缓存预算须大于常看的单文件体积；播完即停种；UPnP 关（无意做端口映射）
      - STREMIOSRV_CACHE_SIZE=${STREMIOSRV_CACHE_SIZE:-30GiB}
      - STREMIOSRV_SEED_ON_COMPLETE=false
      - STREMIOSRV_ENABLE_UPNP=false
      # 慢种下 8MB piece 等 30s 供应不上会掐断转码拉流，放宽到 120s
      - STREMIOSRV_STREAM_PIECE_TIMEOUT=120
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - stream-data:/root/.stremio-server
      # patch：① vaapi 转码分支改 CPU 软解+硬编（老 Intel 核显 VAAPI 解不了 HEVC Main10，
      # 10bit x265 源在全硬链上必死）② HEVC 直拷强制 hvc1 tag（浏览器 MSE 只认 hvc1，ffmpeg 默认写
      # hev1）③ 转码任务 VOD 预声明（整集时长固定；ffmpeg 写 *.live.m3u8 工作副本）；
      # fingerprint 带出源编码供 ② 条件判断。均详见各自文件头注释
      - ./sidecar/converter.py:/srv/app/src/stremiosrv/transcode/converter.py:ro
      - ./sidecar/fingerprint.py:/srv/app/src/stremiosrv/transcode/fingerprint.py:ro
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"

volumes:
  stream-data:
